<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emoji collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #F9F9F9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: none;
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(5, 40px);
            gap: 32px;
            padding: 40px;
            justify-content: center;
            background-color: #F9F9F9;
            background-image:
                linear-gradient(to right, #E0E6E7 1px, transparent 1px),
                linear-gradient(to bottom, #E0E6E7 1px, transparent 1px);
            background-size: 72px 72px;
            background-position: 39px 39px;
        }

        @media (min-width: 600px) {
            .emoji-grid {
                grid-template-columns: repeat(8, 40px);
            }
        }

        @media (min-width: 900px) {
            .emoji-grid {
                grid-template-columns: repeat(12, 40px);
            }
        }

        @media (min-width: 1200px) {
            .emoji-grid {
                grid-template-columns: repeat(auto-fill, minmax(40px, 40px));
            }
        }

        .emoji-item {
            width: 40px;
            height: 40px;
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, filter 0.2s;
            user-select: none;
        }

        .emoji-item:hover {
            transform: scale(1.3);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
        }

        .emoji-item:active {
            transform: scale(1.1);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(40, 40, 40, 0.95);
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast-icon {
            display: inline-block;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>emoji collection</h1>
        <div class="emoji-grid" id="emojiGrid"></div>
    </div>

    <div class="toast" id="toast">
        <span class="toast-icon">✓</span>
        <span id="toastMessage">コピーしました</span>
    </div>

    <script>
        // 絵文字のUnicode範囲を定義（互換性の高い範囲のみ）
        const emojiRanges = [
            [0x1F600, 0x1F64F], // Emoticons（顔文字）
            [0x1F300, 0x1F3FF], // 自然、天気、動物など
            [0x1F400, 0x1F4FF], // 動物、ハート、オブジェクトなど
            [0x1F680, 0x1F6C0], // 乗り物と交通記号
        ];

        // Unicode順に絵文字を生成
        function generateEmojis() {
            const emojis = [];

            for (const [start, end] of emojiRanges) {
                for (let codePoint = start; codePoint <= end; codePoint++) {
                    try {
                        const emoji = String.fromCodePoint(codePoint);
                        emojis.push({
                            emoji: emoji,
                            codePoint: codePoint
                        });
                    } catch (e) {
                        // 無効なコードポイントをスキップ
                    }
                }
            }

            // Unicode順にソート
            emojis.sort((a, b) => a.codePoint - b.codePoint);

            return emojis;
        }

        // 絵文字グリッドを描画
        function renderEmojiGrid() {
            const grid = document.getElementById('emojiGrid');
            const emojis = generateEmojis();

            emojis.forEach(({ emoji }) => {
                const emojiItem = document.createElement('div');
                emojiItem.className = 'emoji-item';
                emojiItem.textContent = emoji;
                emojiItem.title = `クリックしてコピー: ${emoji}`;

                // クリックイベント
                emojiItem.addEventListener('click', () => {
                    copyToClipboard(emoji);
                });

                grid.appendChild(emojiItem);
            });
        }

        // クリップボードにコピー
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                showToast(`${text} をコピーしました`);
            } catch (err) {
                // フォールバック方法
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.select();

                try {
                    document.execCommand('copy');
                    showToast(`${text} をコピーしました`);
                } catch (e) {
                    showToast('コピーに失敗しました', true);
                }

                document.body.removeChild(textArea);
            }
        }

        // トースト通知を表示
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            toastMessage.textContent = message;

            // トーストを表示
            toast.classList.add('show');

            // 3秒後に非表示
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ページ読み込み時に絵文字グリッドを描画
        document.addEventListener('DOMContentLoaded', () => {
            renderEmojiGrid();
        });
    </script>
</body>
</html>
